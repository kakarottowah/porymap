name: Build Porymap
permissions:
  contents: write

on:
  push:
    branches:
      - master
      - dev
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

jobs:
  build-macos:
    strategy:
      matrix:
        os: [macos-latest, macos-13]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set Build Name
        run: echo "BUILD_NAME=porymap-${{ matrix.os }}" >> $GITHUB_ENV

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          modules: 'qtcharts'
          cache: 'true'

      # 🔧 FIX AGL DEFINITIVO: eliminar AGL de todos los .pri internos de Qt (compatible con macOS)
      - name: Remove AGL from Qt internal .pri files
        run: |
          for f in $(find $Qt6_DIR -type f -name "*.pri"); do
            sed -i '' 's/-framework AGL//g' "$f"
          done

      # 🔧 FIX SDK + FIX __yield()
      - name: Configure
        run: qmake -config release CONFIG+=sdk_no_version_check QMAKE_CXXFLAGS+=-Wno-error=implicit-function-declaration porymap.pro

      - name: Compile
        run: make

      # 🔧 Crear solo el .app (sin .dmg)
      - name: Deploy Qt frameworks into .app
        run: macdeployqt porymap.app

      - name: Prep Release Directory
        run: |
          mkdir ${{ env.BUILD_NAME }}
          cp -R porymap.app ${{ env.BUILD_NAME }}/porymap.app
          cp RELEASE-README.txt ${{ env.BUILD_NAME }}/README.txt

      - name: Bundle Release Directory
        run: zip -r ${{ env.BUILD_NAME }}.zip ${{ env.BUILD_NAME }}

      # 🔧 Crear tag automático si no existe
      - name: Create auto-tag if none exists
        if: startsWith(github.ref, 'refs/heads/')
        run: |
          TAG="auto-$(date +%Y%m%d-%H%M%S)"
          git tag $TAG
          git push origin $TAG
          echo "AUTO_TAG=$TAG" >> $GITHUB_ENV

      # 🔧 Release siempre, usando tag automático si no hay uno real
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.AUTO_TAG }}
          files: ${{ env.BUILD_NAME }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
