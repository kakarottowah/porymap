name: Build Porymap
permissions:
  contents: write

on:
  push:
    branches:
      - master
      - dev
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

jobs:
  build-macos:
    strategy:
      matrix:
        os: [macos-latest, macos-13]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      
      - name: Remove AGL framework from Qt link flags
        run: echo "QMAKE_LFLAGS -= -framework AGL" >> porymap.pro

      - name: Set Build Name
        run: echo "BUILD_NAME=porymap-${{ matrix.os }}" >> $GITHUB_ENV

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          modules: 'qtcharts'
          cache: 'true'

      # FIX 1: Silenciar warning del SDK + FIX 2: evitar error de __yield()
      - name: Configure
        run: qmake -config release CONFIG+=sdk_no_version_check QMAKE_CXXFLAGS+=-Wno-error=implicit-function-declaration porymap.pro

      - name: Compile
        run: make

      - name: Create Disk Image
        run: macdeployqt porymap.app -dmg

      - name: Prep Release Directory
        run: |
          mkdir ${{ env.BUILD_NAME }}
          cp porymap.dmg ${{ env.BUILD_NAME }}/porymap.dmg
          cp RELEASE-README.txt ${{ env.BUILD_NAME }}/README.txt

      - name: Bundle Release Directory
        run: zip -r ${{ env.BUILD_NAME }}.zip ${{ env.BUILD_NAME }}

      # FIX 3: Crear tag automáticamente si no existe
      - name: Create auto-tag if none exists
        if: startsWith(github.ref, 'refs/heads/')
        run: |
          TAG="auto-$(date +%Y%m%d-%H%M%S)"
          git tag $TAG
          git push origin $TAG
          echo "AUTO_TAG=$TAG" >> $GITHUB_ENV

      # FIX 4: Release siempre, usando el tag automático si no hay uno real
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.AUTO_TAG }}
          files: ${{ env.BUILD_NAME }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}